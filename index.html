<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurshantering</title>
</head>
<body>
  <h1>Kurshantering</h1>
  <form id="courseForm">
      <input type="text" id="code" placeholder="Kurskod" required />
      <input type="text" id="name" placeholder="Kursnamn" required />

      <select id="progression" required>
        <option value="">Välj progression</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>

      <input type="url" id="syllabus" placeholder="Kurs URL" required />

      <button type="submit">Lägg till kurs</button>
    </form>

    <ul id="courseList"></ul>

    
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
